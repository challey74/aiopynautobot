[project]
name = "aiopynautobot"
version = "0.2.0"
description = "Fully async Nautobot API client built on httpx2"
readme = "README.md"
authors = [
    { name = "Cody Halley" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["nautobot", "async", "asyncio", "httpx2", "api", "client", "ipam", "dcim"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/challey74/aiopynautobot"
Repository = "https://github.com/challey74/aiopynautobot"
Changelog = "https://github.com/challey74/aiopynautobot/blob/main/CHANGELOG.md"
Issues = "https://github.com/challey74/aiopynautobot/issues"

[build-system]
requires = ["uv_build>=0.11.31,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship tests and the changelog in the sdist for distro packagers.
source-include = ["tests/**", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
# hints_generated.pyi is deliberately stub-only (never imported at runtime).
reportMissingModuleSource = false
